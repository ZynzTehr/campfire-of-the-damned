<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff3b00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame-outer" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c62828"/>
      <stop offset="45%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="flame-mid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef6c00"/>
      <stop offset="55%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </linearGradient>
    <linearGradient id="flame-core" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="70%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="log-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="60%" stop-color="#2d1d19"/>
      <stop offset="100%" stop-color="#140a08"/>
    </linearGradient>
  </defs>

  <!-- Ambient Campfire Glow -->
  <circle cx="16" cy="18" r="14" fill="url(#glow)"/>

  <!-- Floating Embers / Sparks -->
  <circle cx="11" cy="6" r="0.75" fill="#ffe082" opacity="0.85"/>
  <circle cx="21" cy="4.5" r="0.65" fill="#ffb74d" opacity="0.9"/>
  <circle cx="16.5" cy="1.8" r="0.55" fill="#fff9c4" opacity="0.95"/>
  <circle cx="7.5" cy="12" r="0.5" fill="#ff9800" opacity="0.75"/>
  <circle cx="24.5" cy="10.5" r="0.6" fill="#ffb74d" opacity="0.85"/>

  <!-- Outer Flame -->
  <path d="M16 2.5C16 2.5 19.5 7.5 19.5 11.5C19.5 12.3 19.3 13 19 13.7C20.4 12.3 21.2 10.8 21.2 8.5C23.8 11.5 24.8 15.2 23.8 18.8C22.4 23.3 18.6 25 16 25C13.4 25 9.6 23.3 8.2 18.8C7.2 15.2 8.2 11.5 10.8 8.5C10.8 10.8 11.6 12.3 13 13.7C12.7 13 12.5 12.3 12.5 11.5C12.5 7.5 16 2.5 16 2.5Z" fill="url(#flame-outer)"/>

  <!-- Mid Flame -->
  <path d="M16 7.5C16 7.5 18.5 11.5 18.5 14.5C18.5 15.3 18.2 16 17.8 16.6C18.8 15.4 19.5 14.3 19.5 12.5C21 15 21.4 17.5 20.7 20C19.7 23 17.5 24 16 24C14.5 24 12.3 23 11.3 20C10.6 17.5 11 15 12.5 12.5C12.5 14.3 13.2 15.4 14.2 16.6C13.8 16 13.5 15.3 13.5 14.5C13.5 11.5 16 7.5 16 7.5Z" fill="url(#flame-mid)"/>

  <!-- White-hot Core Flame -->
  <path d="M16 12.5C16 12.5 17.5 15.5 17.5 17.5C17.5 19.2 16.8 20.8 16 21.8C15.2 20.8 14.5 19.2 14.5 17.5C14.5 15.5 16 12.5 16 12.5Z" fill="url(#flame-core)"/>

  <!-- Crossed Campfire Logs -->
  <rect x="5" y="24" width="22" height="4.2" rx="2.1" transform="rotate(13 16 26.1)" fill="url(#log-grad)" stroke="#0d0605" stroke-width="0.8"/>
  <rect x="5" y="24" width="22" height="4.2" rx="2.1" transform="rotate(-13 16 26.1)" fill="url(#log-grad)" stroke="#0d0605" stroke-width="0.8"/>

  <!-- Glowing Coals Base -->
  <ellipse cx="16" cy="27.8" rx="5.5" ry="1.2" fill="#ff5722" opacity="0.85"/>
  <ellipse cx="16" cy="27.8" rx="2.8" ry="0.6" fill="#ffe082" opacity="0.95"/>
</svg>